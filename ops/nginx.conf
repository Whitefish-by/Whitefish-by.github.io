server {
    listen 80;
    server_name paperenjoyer.com www.paperenjoyer.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://paperenjoyer.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.paperenjoyer.com;
    ssl_certificate /etc/letsencrypt/live/paperenjoyer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paperenjoyer.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://paperenjoyer.com$request_uri;
}

server {
    listen 443 ssl;
    server_name paperenjoyer.com;
    ssl_certificate /etc/letsencrypt/live/paperenjoyer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paperenjoyer.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /srv/paperenjoyer/site/current;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    access_log /var/log/nginx/paperenjoyer-access.log;
    error_log /var/log/nginx/paperenjoyer-error.log;

    # English is canonical at the root. Browsers retain fragments across these redirects.
    location = /en { return 301 /$is_args$args; }
    location = /en/ { return 301 /$is_args$args; }
    location = /en/index.html { return 301 /$is_args$args; }

    location ~ ^/(zh-hans|zh-hant|ja|ko|ru|fr|de)/pricing$ {
        try_files $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/(zh-hans|zh-hant|ja|ko|ru|fr|de)/pricing/(?:index\.html)?$ {
        return 301 /$1/pricing$is_args$args;
    }

    # Stable public URLs without trailing slashes; Astro emits directory indexes.
    location = /pricing { try_files /pricing/index.html =404; add_header Cache-Control "no-cache"; }
    location = /terms { try_files /terms/index.html =404; add_header Cache-Control "no-cache"; }
    location = /privacy { try_files /privacy/index.html =404; add_header Cache-Control "no-cache"; }
    location = /refund { try_files /refund/index.html =404; add_header Cache-Control "no-cache"; }
    location ~ ^/(pricing|terms|privacy|refund)/(?:index\.html)?$ {
        return 301 /$1$is_args$args;
    }

    location = /downloads/latest.json {
        alias /srv/paperenjoyer/mirror/current/release.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }
    location /downloads/ {
        alias /srv/paperenjoyer/mirror/releases/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /download/windows {
        alias /srv/paperenjoyer/mirror/current/windows;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="PaperEnjoyer-Setup.exe"';
        add_header Cache-Control "no-store" always;
    }
    location = /download/mac {
        alias /srv/paperenjoyer/mirror/current/mac;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="PaperEnjoyer-macOS-arm64.dmg"';
        add_header Cache-Control "no-store" always;
    }
    location = /download/linux {
        alias /srv/paperenjoyer/mirror/current/linux;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="PaperEnjoyer-Linux-amd64.deb"';
        add_header Cache-Control "no-store" always;
    }
    location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /download/android {
        alias /srv/paperenjoyer/mirror/current/android;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="PaperEnjoyer-Android.apk"';
        add_header Cache-Control "no-store" always;
    }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
    error_page 404 /404.html;
}
