name: Check and publish website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Save failed browser checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: test-results/
          retention-days: 7
      - name: Upload website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: dist
      - name: Deploy verified static website
        env:
          WEBSITE_SSH_KEY: ${{ secrets.WEBSITE_SSH_KEY }}
          WEBSITE_SSH_KNOWN_HOSTS: ${{ secrets.WEBSITE_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          umask 077
          printf '%s\n' "$WEBSITE_SSH_KEY" > "$RUNNER_TEMP/website_key"
          printf '%s\n' "$WEBSITE_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          tar -czf "$RUNNER_TEMP/site.tar.gz" -C dist .
          ssh -T -i "$RUNNER_TEMP/website_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=4 -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" paper-web@1.13.22.252 < "$RUNNER_TEMP/site.tar.gz"
          curl --fail --silent --show-error --connect-timeout 15 --max-time 60 --retry 3 --output /dev/null https://paperenjoyer.com/
          curl --fail --silent --show-error --connect-timeout 15 --max-time 60 --retry 3 --output /dev/null https://paperenjoyer.com/en/
